name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        working-directory: StellarEduPay-main
        run: npm ci

      - name: Install backend dependencies
        working-directory: StellarEduPay-main/backend
        run: npm ci

      - name: Run tests
        working-directory: StellarEduPay-main
        env:
          NODE_ENV: test
          SCHOOL_WALLET_ADDRESS: GTEST123FAKEWALLET
          MONGO_URI: mongodb://localhost:27017/test
          STELLAR_NETWORK: testnet
        run: npm test
